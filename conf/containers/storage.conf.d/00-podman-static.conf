# podman-static specific storage settings.
# Storage locations (graphroot/runroot) are intentionally not set here:
# podman 6 resolves them per mode (rootful: /var/lib/containers/storage,
# rootless: $XDG_DATA_HOME/containers/storage or $HOME/.local/share/...).
[storage]
driver = "overlay"
[storage.options.overlay]
mount_program = "/usr/local/bin/fuse-overlayfs"
ignore_chown_errors = "true"
